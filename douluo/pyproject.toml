[project]
name = "douluo"
version = "0.1.0"
description = "Track A · RAG prototype on Douluo Dalu corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.14.2",
    "langchain>=1.3.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "openai>=2.38.0",
    "sentence-transformers>=5.5.1",
    "torch>=2.5,<2.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
